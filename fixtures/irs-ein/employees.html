<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Additional Details | EIN Assistant (replica)</title><script src="_reflect.js"></script></head>
<body><p>Replica of the IRS EIN Assistant for engine tests. Built from docs/walks/ny-irs-2026-11-18.md. Not affiliated with the IRS.</p>
<h1>Additional Details</h1>
<fieldset><legend>Do you expect to have employees in the next 12 months?</legend><label><input type="radio" name="emp" value="yes" onchange="document.getElementById('emp-follow').style.display = this.value === 'yes' ? 'block' : 'none'"> Yes</label><br><label><input type="radio" name="emp" value="no" onchange="document.getElementById('emp-follow').style.display = this.value === 'yes' ? 'block' : 'none'"> No</label><br></fieldset><div id="emp-follow" style="display:none"><p><label for="wages-month">First paid wages month</label> <select id="wages-month"><option value="">Select</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></p><p><label for="wages-year">First paid wages year</label> <input id="wages-year" type="text"></p><p><label for="ag">Agricultural</label> <input id="ag" type="number"></p><p><label for="other">Other</label> <input id="other" type="number"></p><fieldset><legend>Will the employment tax liability be $1,000 or less in a full calendar year?</legend><label><input type="radio" name="low" value="yes"> Yes</label><br><label><input type="radio" name="low" value="no"> No</label><br></fieldset></div>
<p><button type="button" onclick="location.href='activity.html'">Continue</button></p></body></html>
