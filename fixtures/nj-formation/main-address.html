<!doctype html><html><head><meta charset="utf-8"><title>NJ Business Formation - Business Information - Main Business Address</title><link rel="stylesheet" href="style.css"><script src="_shell.js"></script></head>
<body><h1>Business Formation</h1><h2>Business Information - Main Business Address</h2>

<form onsubmit="event.preventDefault(); NJ.go(&quot;registered-agent.html&quot;)">
<div class="form-group"><label for="Street1">Street Address 1 <span class="required">*</span></label><input id="Street1" name="Street1" required></div>
<div class="form-group"><label for="Street2">Street Address 2</label><input id="Street2" name="Street2"></div>
<div class="form-group"><label for="City">City <span class="required">*</span></label><input id="City" name="City" required></div>
<div class="form-group"><label for="State">State <span class="required">*</span></label><select id="State" name="State" required><option value="">Select</option><option value="NJ">NJ</option><option value="NY">NY</option><option value="PA">PA</option></select></div>
<div class="form-group"><label for="Zip">Zip <span class="required">*</span></label><input id="Zip" name="Zip" required></div>
<button type="submit" class="btn btn-primary">Continue</button>
</form>
</body></html>
