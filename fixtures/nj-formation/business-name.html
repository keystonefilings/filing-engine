<!doctype html><html><head><meta charset="utf-8"><title>NJ Business Formation - Business Information - Business Name</title><link rel="stylesheet" href="style.css"><script src="_shell.js"></script></head>
<body><h1>Business Formation</h1><h2>Business Information - Business Name</h2>

<form id="f" onsubmit="event.preventDefault(); NJ.set(&quot;name&quot;, document.getElementById(&quot;BusinessName&quot;).value); NJ.go(&quot;designator.html&quot;)">
<div class="form-group"><label for="EntityType">Business Entity Type <span class="required">*</span></label>
<select id="EntityType" name="EntityType" required><option value="">Select</option><option value="DLLC">Domestic Limited Liability Company</option><option value="DP">Domestic Profit Corporation</option><option value="FLLC">Foreign Limited Liability Company</option></select></div>
<div class="form-group"><label for="BusinessName">Business Name <span class="required">*</span></label>
<input id="BusinessName" name="BusinessName" type="text" required><small>Do not include the designator (LLC) here.</small></div>
<button type="submit" class="btn btn-primary">Continue</button> <a class="btn" href="business-name.html">Cancel</a>
</form>
</body></html>
