<!doctype html><html><head><meta charset="utf-8"><title>State of NJ - Online Business Entity Filing</title><link rel="stylesheet" href="style.css"><script src="_shell.js"></script></head>
<body><h1>Business Formation</h1>
<nav><a href="#">Help</a> <a href="#">Retrieve Documents</a> <a href="#">New User</a> <a href="#">Login</a></nav>
<h2>Business Name</h2><p>Required Fields [ * ]</p>
<form onsubmit="event.preventDefault(); NJ.set('name', document.getElementById('BusinessName').value); NJ.go('designator.html')">
<div class="form-group"><label for="BusinessType">What type of business would you like to form? *</label>
<select id="BusinessType" name="BusinessType"><option value="">-- Select One --</option><option value="DP">NJ Domestic For-Profit Corporation (DP)</option><option value="LLC">NJ Domestic Limited Liability Company (LLC)</option><option value="FLC">NJ Foreign Limited Liability Company (FLC)</option></select></div>
<div class="form-group"><label for="BusinessName">Business Name *</label><input id="BusinessName" name="BusinessName" type="text">
<p>DO NOT enter a designator such as Corp., Ltd., LLC, Etc.</p></div>
<input type="submit" class="btn btn-success" value="Continue">
</form><div id="timeoutModal" class="modal"><div class="modal-body"><h3>Session Timeout Warning</h3>
<p>Your session will expire soon.</p><input type="button" class="btn btn-success timeoutPrevent" value="Continue"> <input type="button" class="btn" value="Exit"></div></div>
</body></html>
