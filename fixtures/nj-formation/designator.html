<!doctype html><html><head><meta charset="utf-8"><title>State of NJ - Online Business Entity Filing</title><link rel="stylesheet" href="style.css"><script src="_shell.js"></script></head>
<body><h1>Business Formation</h1>
<nav><a href="#">Help</a> <a href="#">Retrieve Documents</a> <a href="#">New User</a> <a href="#">Login</a></nav>
<p id="avail"></p>
<script>const n=NJ.get("name","").toUpperCase(); document.getElementById("avail").textContent = /TAKEN/.test(n) ? "The Business Name "+n+" is not available." : "Congratulations! The Business Name "+n+" is available.";</script>
<form onsubmit="event.preventDefault(); NJ.set('designator', document.getElementById('BusinessNameDesignator').value); NJ.go('business-data.html')">
<div class="form-group"><label for="BusinessNameDesignator">Business Designator *</label>
<select id="BusinessNameDesignator" name="BusinessNameDesignator"><option value="">-- Select One --</option><option>LLC</option><option>L.L.C.</option><option>LTD LIABILITY CO</option><option>LTD LIABILITY CO.</option><option>LTD LIABILITY COMPANY</option><option>LIMITED LIABILITY CO</option><option>LIMITED LIABILITY CO.</option><option>LIMITED LIABILITY COMPANY</option></select></div>
<input type="submit" class="btn btn-success" value="Continue">
</form><div id="timeoutModal" class="modal"><div class="modal-body"><h3>Session Timeout Warning</h3>
<p>Your session will expire soon.</p><input type="button" class="btn btn-success timeoutPrevent" value="Continue"> <input type="button" class="btn" value="Exit"></div></div>
</body></html>
