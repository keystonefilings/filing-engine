<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts the browser may use in the site checks (web/design/BUILDING.md, "The automated checks"), so a screenshot made on
  one Ubuntu machine matches one made on another, whatever else is installed there. Only two Ubuntu packages:
  fonts-liberation (the metric-matched stand-ins the site falls back to: Liberation Sans for Founders Grotesk,
  Liberation Serif for Miller) and fonts-dejavu-core / fonts-dejavu-mono (the generic families and any glyph Liberation
  lacks). The licensed fonts are never in CI, so the checks run on the stand-ins.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig-cofile-checks</cachedir>

  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>

  <!-- One way of drawing text everywhere: grey antialiasing, slight hinting, no subpixel colour. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
