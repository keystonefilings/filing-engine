# Fly.io deployment (docs/deploy-fly.md): the API and the worker as two process groups of one
# app, built from the browserless "steel" image; every portal's browser runs on Steel. The
# database is an external Postgres (DATABASE_URL secret, e.g. a Neon pooled connection string),
# and documents and screenshots go to Fly's object storage (fly storage create sets BUCKET_NAME
# and the AWS_* secrets). Secrets are set with `fly secrets set`, never in this file.

app = "keystone-filing-engine"   # if you pick another name, change WORKER_WAKE_URL below to match
primary_region = "iad"           # Ashburn, next to Steel's sessions and a Neon project in AWS us-east-1

kill_signal = "SIGTERM"
kill_timeout = 300               # seconds: the worker finishes the filing in progress before it stops

[build]
  dockerfile = "Dockerfile"
  build-target = "steel"

[deploy]
  # Replace machines one at a time, stopping the old one first: a starting worker marks any
  # filing still shown as running as interrupted, so two workers must never overlap.
  strategy = "rolling"

# Secrets (fly secrets set, docs/deploy-fly.md step 3). The API and the worker refuse to start,
# naming everything missing, until these are set:
#   DATABASE_URL             Neon pooled connection string, ending in ?sslmode=require
#   API_KEYS                 <caller key>:keystone
#   STAFF_API_KEYS           <staff key>:<identity>   (tenant settings, drift reviews)
#   APPROVAL_SIGNING_SECRET  32+ random characters    (signs approval and admin links)
#   WORKER_WAKE_TOKEN        random, shared by the API and the worker
#   STEEL_API_KEY            this app's own Steel key
# Set by `fly storage create`: BUCKET_NAME, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_ENDPOINT_URL_S3, AWS_REGION. Added later: STEEL_PROFILES (saved sign-ins) and
# PUBLIC_BASE_URL (the approval-link address, not decided yet).

[env]
  NODE_ENV = "production"
  WORKER_ENABLED = "false"       # the api group serves only; the worker group runs the filings
  BROWSER_PROXY = "steel"
  WORKER_TENANTS = "keystone"
  DRY_RUN_DEFAULT = "true"
  WORKER_PORT = "8081"
  # Idle check every 10 minutes (the database can scale to zero in between); the API wakes the
  # worker over Fly's private network as soon as a filing is queued.
  WORKER_IDLE_POLL_MS = "600000"
  WORKER_WAKE_URL = "http://worker.process.keystone-filing-engine.internal:8081/wake"
  # PUBLIC_BASE_URL (the address in approval links) is not decided yet: set it as a secret or
  # here once it is, e.g. https://filings.keystonefilings.com (docs/deploy-fly.md, step 9).

[processes]
  # node itself, not npx, so the stop signal reaches the program directly
  api = "node --import tsx src/index.ts"
  worker = "node --import tsx src/worker.ts"

# The API: public over HTTPS, stopped when idle and started on the next request.
[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# The worker: always on, no public port; /healthz and /wake on the private network only.
[checks]
  [checks.worker]
    processes = ["worker"]
    type = "http"
    port = 8081
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  processes = ["api", "worker"]
  size = "shared-cpu-1x"
  memory = "1gb"
